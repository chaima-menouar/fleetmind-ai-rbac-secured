name: AWS CDK Deploy Free Tier Safe

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473671719284:role/FleetMindGitHubDeployRole
          aws-region: us-east-1
          role-session-name: FleetMindCDKDeploy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cdk/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: Synthesize free-tier-safe stacks
        working-directory: cdk
        run: npx cdk synth -c freeTierOnly=true -c production=false

      - name: Deploy free-tier-safe stacks
        working-directory: cdk
        run: npx cdk deploy --all -c freeTierOnly=true -c production=false --require-approval never
