name: AWS OIDC Check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          JWT=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          export JWT
          python - <<'PY'
          import base64, json, os
          payload = os.environ["JWT"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("aud", "sub", "repository", "ref", "workflow_ref"):
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473671719284:role/FleetMindGitHubDeployRole
          aws-region: us-east-1
          role-session-name: FleetMindGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity
