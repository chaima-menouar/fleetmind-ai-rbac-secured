name: AWS OIDC Check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473671719284:role/FleetMindGitHubDeployRole
          aws-region: us-east-1
          role-session-name: FleetMindGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity
