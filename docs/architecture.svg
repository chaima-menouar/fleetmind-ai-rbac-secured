<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="430" viewBox="0 0 1250 430" role="img" aria-labelledby="title desc"><title id="title">FleetMind AI architecture</title><desc id="desc">A React workspace calls FastAPI with RBAC. Deterministic fleet analytics, RAG, role policy, and predictive maintenance feed grounded AI responses, with optional AWS cloud services.</desc><defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 18px Arial,sans-serif;fill:#0f172a}.s{font:14px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect class="b" x="30" y="160" width="180" height="90"/><text class="t" x="120" y="195" text-anchor="middle">React Workspace</text><text class="s" x="120" y="223" text-anchor="middle">role-aware UI</text><rect class="b" x="265" y="160" width="180" height="90"/><text class="t" x="355" y="195" text-anchor="middle">FastAPI</text><text class="s" x="355" y="223" text-anchor="middle">auth + RBAC</text><rect class="b" x="505" y="40" width="205" height="90"/><text class="t" x="607" y="75" text-anchor="middle">Fleet Analytics</text><text class="s" x="607" y="103" text-anchor="middle">KPIs + risk scoring</text><rect class="b" x="505" y="170" width="205" height="90"/><text class="t" x="607" y="205" text-anchor="middle">RAG + Role Policy</text><text class="s" x="607" y="233" text-anchor="middle">approved context</text><rect class="b" x="505" y="300" width="205" height="90"/><text class="t" x="607" y="335" text-anchor="middle">Predictive ML</text><text class="s" x="607" y="363" text-anchor="middle">Scania APS</text><rect class="b" x="785" y="105" width="205" height="90"/><text class="t" x="887" y="140" text-anchor="middle">LLM Gateway</text><text class="s" x="887" y="168" text-anchor="middle">demo / Bedrock</text><rect class="b" x="785" y="245" width="205" height="90"/><text class="t" x="887" y="280" text-anchor="middle">Data Layer</text><text class="s" x="887" y="308" text-anchor="middle">demo store / DynamoDB</text><rect class="b" x="1060" y="160" width="160" height="90"/><text class="t" x="1140" y="195" text-anchor="middle">AWS Path</text><text class="s" x="1140" y="223" text-anchor="middle">CDK + cloud</text><line class="a" x1="210" y1="205" x2="265" y2="205"/><path class="a" d="M445 185 C475 185 475 85 505 85"/><path class="a" d="M445 205 H505"/><path class="a" d="M445 225 C475 225 475 345 505 345"/><path class="a" d="M710 85 C750 85 750 140 785 150"/><path class="a" d="M710 215 C750 215 750 165 785 160"/><path class="a" d="M710 345 C750 345 750 290 785 290"/><path class="a" d="M990 150 C1025 150 1025 190 1060 195"/><path class="a" d="M990 290 C1025 290 1025 220 1060 215"/></svg>