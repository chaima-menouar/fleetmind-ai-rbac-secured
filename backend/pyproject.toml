[project]
name = "fleetmind-ai-backend"
version = "0.5.0"
description = "FastAPI backend for the FleetMind AI automotive operations platform"
authors = [{ name = "Chaima Menouar" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "boto3>=1.40.0,<2.0.0",
    "mangum>=0.19.0,<0.20.0",
    "python-multipart>=0.0.20,<0.1.0",
    "joblib>=1.5.0,<2.0.0",
    "numpy>=2.3.0,<3.0.0",
    "scikit-learn>=1.9.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "mypy>=1.10.0,<2.0.0",
    "httpx>=0.28.0,<0.29.0",
    "ruff>=0.12.0,<0.13.0",
    "pandas>=2.3.0,<4.0.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
